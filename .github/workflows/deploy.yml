name: React CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
         node-version: 20

    - run: npm install

    - run: npm run build